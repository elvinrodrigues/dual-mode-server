name: release

# Push a tag like v0.1.0 to publish a new version to the APT repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils dpkg gnupg

      - name: Build .deb
        run: bash packaging/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Attach .deb to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

      # Pages replaces the whole site, so keep every earlier version in the repo.
      - name: Fetch earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern '*.deb' --dir dist --skip-existing || true

      - name: Build signed APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "Secret GPG_PRIVATE_KEY is not set"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          bash packaging/build-apt-repo.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
